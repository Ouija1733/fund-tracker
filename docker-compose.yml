services:
    db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        environment:
            ACCEPT_EULA: "Y"
            MSSQL_SA_PASSWORD: "FundTracker!2026"
        ports:
            - "1433:1433"
        volumes:
            - sqldata:/var/opt/mssql
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q ''SELECT 1'' || exit 1',
                ]
            interval: 10s
            retries: 10

    api:
        build: ./src/FundTracker.Api
        environment:
            ASPNETCORE_ENVIRONMENT: Development
            ApplyMigrations: "true"
            ConnectionStrings__Default: "Server=db,1433;Database=FundTracker;User Id=sa;Password=FundTracker!2026;TrustServerCertificate=True"
        ports:
            - "5080:8080"
        depends_on:
            db:
                condition: service_healthy

    web:
        build: ./client
        ports:
            - "3000:80"
        depends_on:
            - api

volumes:
    sqldata:
