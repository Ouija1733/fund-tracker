name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    backend:
        name: Backend (.NET)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"
            - run: dotnet restore
            - run: dotnet build --no-restore -c Release
            - run: dotnet test --no-build -c Release --verbosity normal

    frontend:
        name: Frontend (React)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: client
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: client/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run build

    docker:
        name: Docker images
        runs-on: ubuntu-latest
        needs: [backend, frontend]
        steps:
            - uses: actions/checkout@v4
            - run: docker build -t fund-tracker-api ./src/FundTracker.Api
            - run: docker build -t fund-tracker-web ./client
